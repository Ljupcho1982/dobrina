<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&amp;display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #c75b2a; }
    a:hover { color: #a8481f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fdf6ec; color: #3a2c22; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 14px 18px 0; flex: none;">
    <div style="display: flex; align-items: center; gap: 5px; color: #8a7460; font-size: 14px; font-weight: 600; margin-bottom: 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Назад
    </div>

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
      <div style="width: 74px; height: 74px; border-radius: 50%; flex: none; background: #d9a441; color: #fffaf3; display: flex; align-items: center; justify-content: center; font-family: Literata, Georgia, serif; font-size: 27px; font-weight: 700;">ДР</div>
      <div>
        <div style="font-family: Literata, Georgia, serif; font-size: 25px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em;">Дедо Ристо</div>
        <div style="font-size: 13.5px; color: #8a7460;">дедо · 12 добрини · 9 со неговиот глас</div>
      </div>
    </div>

    <div style="display: flex; gap: 9px; margin-bottom: 14px;">
      <button style="flex: 1.3; display: flex; align-items: center; justify-content: center; gap: 7px; background: #c75b2a; border: 1px solid #c75b2a; color: #fff; border-radius: 999px; padding: 11px; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        Кажи нешто добро
      </button>
      <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #e8d9c5; background: transparent; color: #3a2c22; border-radius: 999px; padding: 11px; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 16.5Z"></path>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5Z"></path>
        </svg>
        Книга
      </button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 18px 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
      <div style="background: #fffaf3; border: 1px solid #e8d9c5; border-radius: 16px; padding: 13px 15px; box-shadow: 0 2px 10px rgba(90, 60, 30, 0.07); flex: none;">
        <div style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #8a7460; margin-bottom: 7px;">
          <span style="font-size: 15px;">{{e.emoji}}</span>
          <span style="font-weight: 700; color: #3a2c22;">{{e.kind}}</span>
          <span>· {{e.when}}</span>
          <span style="margin-left: auto; color: #6a8f5f; font-weight: 600; display: flex; align-items: center; gap: 3px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            испратено
          </span>
        </div>
        <p style="margin: 0 0 9px; font-size: 14.5px; line-height: 1.45;">{{e.text}}</p>
        <div style="display: flex; align-items: center; gap: 10px; background: #fdf6ec; border: 1px solid #e8d9c5; border-radius: 999px; padding: 6px 12px 6px 8px;">
          <div style="width: 28px; height: 28px; border-radius: 50%; background: #c75b2a; flex: none; display: flex; align-items: center; justify-content: center;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#fffaf3" aria-hidden="true"><path d="M8 5v14l11-7Z"></path></svg>
          </div>
          <div style="flex: 1; display: flex; align-items: center; gap: 2px; height: 20px;">
            <sc-for list="{{e.wave}}" as="w" hint-placeholder-count="22">
              <div style="{{w.style}}"></div>
            </sc-for>
          </div>
          <span style="font-size: 12px; color: #8a7460; font-variant-numeric: tabular-nums;">{{e.dur}}</span>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"filter":{"editor":"enum","default":"site","options":["site","dobro","nauchiv","smea","recept"],"section":"Состојба"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: null };
  }
  renderVals() {
    const active = this.state.f === null ? (this.props.filter ?? 'site') : this.state.f;

    const filters = [
      { id: 'site', label: 'сè' },
      { id: 'dobro', label: '💛 Добрина' },
      { id: 'nauchiv', label: '🪚 Научив' },
      { id: 'smea', label: '😄 Смеа' },
      { id: 'recept', label: '🍲 Рецепт' }
    ];

    const all = [
      { id: 'smea', emoji: '😄', kind: 'Смеа', when: 'слава', dur: '0:41',
        text: 'Заборави дека ја исклучил струјата и половина час бараше зошто не работи фрижидерот. Уште се смееме.' },
      { id: 'nauchiv', emoji: '🪚', kind: 'Научив', when: 'лето на село', dur: '1:12',
        text: 'Ме научи да калемам слива. Уште држи, триесет години подоцна.' },
      { id: 'recept', emoji: '🍲', kind: 'Рецепт', when: 'зимница', dur: '2:03',
        text: 'Ајварот се пече бавно, вели. Кој брза, јаде чад.' },
      { id: 'dobro', emoji: '💛', kind: 'Добрина', when: 'кога бев мал', dur: '0:28',
        text: 'Ми ја плати првата година факултет, а никому не рече дека ја продал нивата.' }
    ];

    const seeds = [7, 13, 5, 16, 9, 18, 6, 12, 15, 8, 17, 10, 14, 6, 19, 11, 7, 15, 9, 13, 5, 12];
    const wave = (offset) => seeds.map((h, i) => ({
      style: 'flex: 1; border-radius: 1px; height: ' + h + 'px; background: '
        + (i < offset ? '#c75b2a' : '#e8d9c5') + ';'
    }));

    const chip = (on) => 'border: 1px solid ' + (on ? '#c75b2a' : '#e8d9c5')
      + '; background: ' + (on ? '#c75b2a' : '#fffaf3')
      + '; color: ' + (on ? '#ffffff' : '#3a2c22')
      + '; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;';

    return {
      filters: filters.map((f) => ({
        label: f.label,
        style: chip(f.id === active),
        pick: () => this.setState({ f: f.id })
      })),
      entries: all
        .filter((e) => active === 'site' || e.id === active)
        .map((e, i) => Object.assign({}, e, { wave: wave(6 + i * 3) }))
    };
  }
}
</script>
</body>
</html>
