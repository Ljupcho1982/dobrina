<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&amp;display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #c75b2a; }
    a:hover { color: #a8481f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fdf6ec; color: #3a2c22; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.5; display: flex; flex-direction: column; padding: 26px 22px 24px; overflow: hidden;">

  <div style="flex: 1; background: #fffaf3; border: 1px solid #e8d9c5; border-radius: 22px; box-shadow: 0 4px 20px rgba(90, 60, 30, 0.09); padding: 30px 26px 26px; display: flex; flex-direction: column; position: relative; overflow: hidden;">

    <div style="position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(217, 164, 65, 0.26), rgba(217, 164, 65, 0) 68%); pointer-events: none;"></div>

    <div style="position: relative; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #c75b2a; font-weight: 700; margin-bottom: 16px;">Твојата 2026 · Добрина</div>

    <div style="position: relative; font-family: Literata, Georgia, serif; font-size: 62px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.92; margin-bottom: 8px;">47</div>
    <p style="position: relative; font-family: Literata, Georgia, serif; font-size: 22px; line-height: 1.34; margin: 0 0 26px; max-width: 280px; text-wrap: pretty;">работи што некој ги чул на време.</p>

    <div style="position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;">
      <sc-for list="{{marks}}" as="m" hint-placeholder-count="47">
        <svg width="15" height="15" viewBox="0 0 24 24" style="{{m.style}}" aria-hidden="true">
          <path d="M12 21s-8.4-5.2-8.4-11A4.9 4.9 0 0 1 12 7.2a4.9 4.9 0 0 1 8.4 2.8c0 5.8-8.4 11-8.4 11Z"></path>
        </svg>
      </sc-for>
    </div>

    <div style="position: relative; display: flex; gap: 18px; font-size: 12.5px; color: #8a7460; margin-bottom: 28px;">
      <span style="display: flex; align-items: center; gap: 6px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #c75b2a; display: block;"></span>
        41 испратени
      </span>
      <span style="display: flex; align-items: center; gap: 6px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid #d9a441; display: block;"></span>
        6 сè уште кај тебе
      </span>
    </div>

    <div style="position: relative; border-top: 1px solid #e8d9c5; padding-top: 20px; display: flex; flex-direction: column; gap: 13px; margin-bottom: auto;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; align-items: baseline; gap: 11px;">
          <span style="font-family: Literata, Georgia, serif; font-size: 21px; font-weight: 700; color: #c75b2a; min-width: 32px; font-variant-numeric: tabular-nums;">{{l.n}}</span>
          <span style="font-size: 14.5px; line-height: 1.4;">{{l.text}}</span>
        </div>
      </sc-for>
    </div>

    <p style="position: relative; font-family: Literata, Georgia, serif; font-size: 17px; line-height: 1.45; margin: 24px 0 0; max-width: 290px; text-wrap: pretty;">Ниту едно од ова немаше да постои ако чекаше.</p>

  </div>

  <button style="flex: none; display: flex; align-items: center; justify-content: center; gap: 9px; background: #c75b2a; border: 1px solid #c75b2a; color: #fff; border-radius: 999px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
      <path d="M12 15V3"></path><path d="m8 7 4-4 4 4"></path>
    </svg>
    Сподели ја годината
  </button>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const total = 47, sent = 41;
    const marks = [];
    for (let i = 0; i < total; i++) {
      marks.push({
        style: i < sent
          ? 'fill: #c75b2a; display: block;'
          : 'fill: none; stroke: #d9a441; stroke-width: 1.9; display: block;'
      });
    }
    return {
      marks,
      lines: [
        { n: '12', text: 'за Дедо Ристо — најмногу од сите' },
        { n: '19', text: 'носат нечиј глас, не само букви' },
        { n: '6', text: 'луѓе знаат нешто што порано не го знаеја' }
      ]
    };
  }
}
</script>
</body>
</html>
