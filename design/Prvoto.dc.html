<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&amp;display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #c75b2a; }
    a:hover { color: #a8481f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fdf6ec; color: #3a2c22; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.5; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <div style="{{glow}}"></div>

  <div style="position: relative; flex: none; padding: 16px 26px 0; display: flex; align-items: center; gap: 9px;">
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M10 14h44a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H28L16 55v-11h-6a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4Z" fill="#c75b2a"></path>
      <path d="M32 36s-9-5.4-9-11.2A5 5 0 0 1 32 21a5 5 0 0 1 9 3.8C41 30.6 32 36 32 36Z" fill="#d9a441"></path>
    </svg>
    <span style="font-weight: 700; font-size: 15px; color: #8a7460;">Добрина</span>
  </div>

  <div style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 26px 30px;">

    <div style="font-size: 15px; color: #8a7460; margin-bottom: 6px;">{{greeting}}</div>
    <div style="font-size: 15px; color: #8a7460; margin-bottom: 34px; max-width: 300px; text-wrap: pretty;">Уште ништо не си кажал. Сите почнуваме од тука.</div>

    <div style="font-family: Literata, Georgia, serif; font-size: 52px; font-weight: 700; letter-spacing: -0.035em; line-height: 0.98; margin-bottom: 22px;">Дедо<br>Ристо.</div>

    <div style="width: 46px; height: 3px; background: #c75b2a; border-radius: 2px; margin-bottom: 22px;"></div>

    <p style="font-family: Literata, Georgia, serif; font-size: 20px; line-height: 1.42; margin: 0 0 16px; max-width: 310px; text-wrap: pretty;">Што те научи со раце — нешто што сега го знаеш само поради него?</p>

    <p style="font-size: 15px; color: #8a7460; margin: 0 0 38px;">Триесет секунди. Ќе го чуе денес.</p>

    <button style="display: flex; align-items: center; justify-content: center; gap: 9px; background: #c75b2a; border: 1px solid #c75b2a; color: #fff; border-radius: 999px; padding: 17px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(199, 91, 42, 0.24);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <path d="M12 18v4"></path>
      </svg>
      Кажи го
    </button>

    <button style="background: transparent; border: none; color: #8a7460; padding: 15px 0 0; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;">Друго прашање</button>

  </div>

  <div style="position: relative; flex: none; padding: 0 26px 30px; font-size: 12.5px; color: #8a7460; line-height: 1.55; max-width: 320px;">Сè останува на овој телефон. Нема сметка, нема сервер, никој друг не гледа.</div>

</div>
</x-dc>

<script data-dc-script data-props='{"light":{"editor":"enum","default":"утро","options":["утро","вечер"],"section":"Светло"}}'>
class Component extends DCLogic {
  renderVals() {
    const evening = (this.props.light ?? 'утро') === 'вечер';
    return {
      greeting: evening ? 'Добра вечер.' : 'Добро утро.',
      glow: 'position: absolute; pointer-events: none; width: 520px; height: 520px; border-radius: 50%;'
        + (evening
            ? ' right: -190px; top: -160px; background: radial-gradient(circle, rgba(199, 91, 42, 0.2), rgba(199, 91, 42, 0) 66%);'
            : ' left: -180px; bottom: -150px; background: radial-gradient(circle, rgba(217, 164, 65, 0.34), rgba(217, 164, 65, 0) 66%);')
    };
  }
}
</script>
</body>
</html>
